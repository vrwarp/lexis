name: Docker publish

# Pushes to Docker Hub only after a merge to main, and only once every CI job (typecheck,
# unit and integration tests, build, Playwright) passed on that merge commit. Pull requests
# never push: they get the dry run in docker-dry-run.yml.
#
# Repository settings needed (Settings > Secrets and variables > Actions):
#   secret   DOCKERHUB_USERNAME  Docker Hub user name
#   secret   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#   variable DOCKERHUB_REPO      optional, e.g. "vrwarp/lexis" (defaults to <username>/lexis)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push to Docker Hub
    # workflow_run fires for every CI run on main; only publish green pushes (merges), never PR runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the image name
        id: image
        env:
          REPO: ${{ vars.DOCKERHUB_REPO }}
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$USER" ]; then echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."; exit 1; fi
          echo "name=${REPO:-$USER/lexis}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=lexis
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # x86_64 host.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
