name: Docker dry run

# Pull requests only: everything the Docker Hub push does (image name, tags,
# labels, Docker Hub login, build) except the push itself, then boot the image
# and check it serves the app.
on:
  pull_request:

concurrency:
  group: docker-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Build and boot the image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name the publish would use
        id: image
        env:
          REPO: ${{ vars.DOCKERHUB_REPO }}
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$USER" ]; then
            echo "name=${REPO:-$USER/lexis}" >> "$GITHUB_OUTPUT"
            echo "login=true" >> "$GITHUB_OUTPUT"
          else
            # Pull requests from forks get no secrets: still build, just skip the login check.
            echo "::warning::DOCKERHUB_USERNAME is not available; skipping the Docker Hub login check."
            echo "name=${REPO:-lexis/lexis}" >> "$GITHUB_OUTPUT"
            echo "login=false" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=lexis
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v3

      # Proves the publish credentials still work, so a merge does not discover a bad token.
      - name: Log in to Docker Hub (credentials check)
        if: ${{ steps.image.outputs.login == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build exactly as the publish would, without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What a merge would push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Docker Hub dry run"
            echo "A merge of this pull request would push:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS"

      - name: Boot the container and wait for /healthz
        env:
          IMAGE: ${{ steps.image.outputs.name }}:latest
        run: |
          docker run -d --name lexis -p 8080:8080 -e LEXIS_PASSWORD=ci-dry-run "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; echo "healthy after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz > /dev/null
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="login-screen"'
          # The API refuses without the cookie, and lets the password in.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/projects)" = 401
          curl -fsS -c jar -H 'content-type: application/json' -d '{"password":"ci-dry-run"}' http://127.0.0.1:8080/api/auth/password
          curl -fsS -b jar http://127.0.0.1:8080/api/projects | grep -q '^\[\]$'
          # Security headers, the passkey helper, and refusal of cross-site writes.
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:8080/vendor/webauthn.js | grep -q SimpleWebAuthnBrowser
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar -H 'origin: https://evil.example' -X POST http://127.0.0.1:8080/api/auth/sessions/revoke-others)" = 403
          docker exec lexis node dist/cli.js status | grep -q 'password sign-in: on'
          # Claude Code offers a subscription sign-in link from inside the container.
          curl -fsS -b jar -X POST http://127.0.0.1:8080/api/claude/login/start | grep -q '"url":"https://'
          curl -fsS -b jar -X POST http://127.0.0.1:8080/api/claude/login/cancel

      - name: Check the pipeline's command-line tools are present
        run: docker exec lexis sh -c 'git --version && zip -v | head -1 && unzip -v | head -1'

      - name: Check the bundled Claude binary runs as the app user
        run: docker exec lexis claude --version

      - name: Show the image size
        run: docker image ls

      - name: Container logs
        if: ${{ always() }}
        run: docker logs lexis || true
